input:
  type: csv
  properties:
    path: tests/stubs/csv_rag/base_radio_manual.csv
    target_column: content
    separator: "\t"

pipeline:
  - type: split
    method: chunk
    name: chunk_faq
    parameters:
      size: 9999

  # - type: split
  #   method: separator
  #   name: sentence_chunk_faq
  #   parameters:
  #     separator: .
  #     keep_separator: true

  - type: generation
    method: async-llm
    parameters:
      provider: mistral
      model: mistral-large-latest
      batch_size: 40
      template: |
        You are a human in a car looking for information about the vehicle.
        The question must be natural, like a question a human would ask in a typical request to a incar assistant.
        Ask a question about the content.
        content: {chunk_faq}

        Instructions :
        1. Use english only
        2. Keep it short

        Answer directly the question, do not add any other text.

  - type: clean
    method: deduplicate-embed
    parameters:
      provider: mistral
      model: mistral-embed
      similarity_threshold: 0.7

output:
  type: csv
  properties:
    path: tests/stubs/csv_rag/output_radio_manual_embed.csv
    separator: "\t"
